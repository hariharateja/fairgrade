<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FairGrade</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7fb; color: #0f172a;
             font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      .logo { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 16px; background: linear-gradient(135deg, #6366f1, #4338ca); }
      p { color: #475569; }
    </style>
  </head>
  <body>
    <!-- Shown only if the app can't reach the FairGrade server (e.g. no internet). -->
    <div>
      <div class="logo"></div>
      <h1>FairGrade</h1>
      <p>Can't reach the server. Check your internet connection and reopen the app.</p>
    </div>
  </body>
</html>
